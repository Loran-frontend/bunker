name: Reconnect regression

on:
  push:
  pull_request:

jobs:
  reconnect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node test/reconnect.test.js
