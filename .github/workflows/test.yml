name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile on dependency-audit branch
        if: github.ref == 'refs/heads/security/dependency-audit-2026-09'
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        if: github.ref == 'refs/heads/security/dependency-audit-2026-09'
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh package lockfile"
          git push origin HEAD:security/dependency-audit-2026-09
      - run: npm ci
      - run: npm test
