name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh body-parser lock on audit branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/dependency-audit-2026-09'
        run: npm update body-parser --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/dependency-audit-2026-09'
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): update body-parser transitive dependency"
          git push origin HEAD:security/dependency-audit-2026-09
      - run: npm ci
      - run: npm test
